name: Sync Court Availability

on:
  schedule:
    # Runs every hour from 10:00 to 22:00 JST (01:00 to 13:00 UTC)
    - cron: '0 1-13 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: okayama-pickleball

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: okayama-pickleball/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape yoyacool availability
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-availability.js
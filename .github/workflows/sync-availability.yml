name: Sync Court Availability

on:
  schedule:
    # Runs hourly from 11:28 to 21:28 JST (02:28–12:28 UTC) and at 06:28 JST (21:28 UTC)
    - cron: '28 2-12,21 * * *'
  workflow_dispatch:

concurrency:
  group: sync-court-availability
  cancel-in-progress: true

defaults:
  run:
    working-directory: okayama-pickleball

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: okayama-pickleball/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync yoyacool availability (Okayama City)
        run: node scripts/scrape-yoyacool.js

      - name: Sync Spacepad availability (Kurashiki City)
        if: always()
        run: node scripts/scrape-spacepad.js

      - name: Prune booked-out time blocks & 0-vote rows
        if: success()
        run: node scripts/run-prune-votes.js
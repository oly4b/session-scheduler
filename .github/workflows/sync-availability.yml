name: Sync Court Availability

on:
  schedule:
    # Runs hourly from around 11:30 to 21:30 JST (02:30 to 13:30 UTC) and at 06:30 JST (21:30 UTC)
    - cron: '28 2-12,21 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: okayama-pickleball

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: okayama-pickleball/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape yoyacool availability (Seto Gym)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-availability.js

      - name: Sync Spacepad availability (Fukuda Park & Mizushima Gym)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-spacepad.js
name: Sync Court Availability

on:
  schedule:
    # Runs hourly from 11:28 to 21:28 JST (02:28-12:28 UTC)
    - cron: '28 2-12 * * *'
  workflow_dispatch:

concurrency:
  group: sync-court-availability
  cancel-in-progress: false

defaults:
  run:
    working-directory: okayama-pickleball

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: okayama-pickleball/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('okayama-pickleball/package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi

      - name: Sync Yoyacool availability (Okayama City)
        id: yoyacool
        continue-on-error: true
        run: node scripts/scrape-yoyacool.js

      - name: Sync Spacepad availability (Kurashiki City)
        id: spacepad
        continue-on-error: true
        run: node scripts/scrape-spacepad.js

      - name: Prune stale votes
        if: steps.yoyacool.outcome == 'success' && steps.spacepad.outcome == 'success'
        run: node scripts/run-prune-votes.js

      - name: Fail job if any scraper failed
        if: steps.yoyacool.outcome != 'success' || steps.spacepad.outcome != 'success'
        run: exit 1
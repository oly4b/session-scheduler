    <!-- Apply saved or system dark theme before React mounts to avoid a light flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('momodinks_theme');
          var isDark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (_) {}
      })();
    </script>

  <body>
    <div id="root"></div>
